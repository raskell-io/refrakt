# Refrakt - mise configuration
# https://mise.jdx.dev/
#
# The repository holds two Gleam packages:
#   packages/refrakt      runtime library
#   packages/refrakt_cli  code generator
# The tasks below run in both of them.

[tools]
erlang = "27"
gleam = "1.19"
rebar = "3"

[env]
REFRAKT_PACKAGES = "packages/refrakt packages/refrakt_cli"

# =============================================================================
# Build
# =============================================================================

[tasks.build]
description = "Build both packages (warnings are errors)"
run = "for p in $REFRAKT_PACKAGES; do (cd $p && gleam build --warnings-as-errors) || exit 1; done"

[tasks.check]
description = "Type-check both packages without a full build"
run = "for p in $REFRAKT_PACKAGES; do (cd $p && gleam check) || exit 1; done"

# =============================================================================
# Development
# =============================================================================

[tasks.fmt]
description = "Format code"
run = "for p in $REFRAKT_PACKAGES; do (cd $p && gleam format src test) || exit 1; done"

[tasks."fmt:check"]
description = "Check formatting"
run = "for p in $REFRAKT_PACKAGES; do (cd $p && gleam format --check src test) || exit 1; done"

# =============================================================================
# Test
# =============================================================================

[tasks.test]
description = "Run the tests of both packages"
run = "for p in $REFRAKT_PACKAGES; do (cd $p && gleam test) || exit 1; done"

[tasks."test:generated"]
description = "Generate an app with the in-repo CLI and build/test/boot it (arg: none|sqlite|postgres)"
run = ".github/scripts/test-generated-app.sh"

[tasks."test:docker"]
description = "Generate an app, docker build its gen deploy image and smoke-test it (arg: sqlite|postgres)"
run = ".github/scripts/test-docker-image.sh"

[tasks."test:examples"]
description = "Build and test the example apps"
run = "for e in examples/blog examples/tasks_app; do (cd $e && gleam format --check src test && gleam build --warnings-as-errors && gleam test) || exit 1; done"

# =============================================================================
# Documentation
# =============================================================================

[tasks.doc]
description = "Generate documentation for both packages"
run = "for p in $REFRAKT_PACKAGES; do (cd $p && gleam docs build) || exit 1; done"

# =============================================================================
# Lint
# =============================================================================

[tasks.lint]
description = "Run all lints (format check)"
depends = ["fmt:check"]

# =============================================================================
# CI
# =============================================================================

[tasks.ci]
description = "Run the package checks from CI"
depends = ["fmt:check", "build", "test", "doc"]

[tasks."ci:quick"]
description = "Quick CI check"
depends = ["check", "test"]

# =============================================================================
# Maintenance
# =============================================================================

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf packages/refrakt/build packages/refrakt_cli/build"

[tasks.deps]
description = "Update dependencies"
run = "for p in $REFRAKT_PACKAGES; do (cd $p && gleam update) || exit 1; done"
